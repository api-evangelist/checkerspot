aid: checkerspot
name: Checkerspot
description: 'Checkerspot is an Alameda, California biotechnology company, founded in
  2016 and incorporated as a Public Benefit Corporation, that designs and produces
  functional fats and oils through precision fermentation of microalgae. Its biology-driven
  molecule licensing platform pairs algal strain development, an advanced analytical
  platform, bioinformatics, high-throughput screening, fermentation scale-up and downstream
  oil refining, built around the proprietary microbe Prototheca moriformis, which the
  company reports reaches over 80% oil content by dry cell weight. The commercial molecule
  portfolio includes a high sn-2 palmitate algal oil that mimics the triglyceride structure
  of human milk fat for infant nutrition, an Omega-7 (palmitoleic acid) algal oil, a
  designer high-oleic tropical-fat alternative to palm oil, and Algolein tG C18/80 for
  cosmetic formulation; earlier work commercialized algae-derived urethane composites
  through the WNDR Alpine outdoor brand. Checkerspot works through ingredient and manufacturing
  partners including AAK, Huvepharma and La Fabrique Vegetale, and closed a USD 55 million
  Series C led by ArrowMark Partners with participation from Cox Enterprises. It is a
  business-to-business ingredient and molecule licensing company rather than a software
  vendor: it operates a WordPress marketing site, publishes no developer portal, no API
  documentation, no SDK and no machine-readable API contract, and has no GitHub organization.'
