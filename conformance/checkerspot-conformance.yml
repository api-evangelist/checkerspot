generated: '2026-08-02'
method: searched
source: Checkerspot public site, partner announcements and trade-press coverage (2026-08-02
  web search) plus the live probes recorded in well-known/checkerspot-well-known.yml
scope: >-
  Checkerspot publishes no API, so there are no API or cross-cutting technical standards
  to assert. What the company is actually measured against is the food-ingredient
  regulatory pathway for a novel precision-fermented lipid - principally US FDA GRAS
  self-affirmation or notification for its algal oils, and the infant-formula pathway
  for the high sn-2 palmitate oil, where its partner Huvepharma has publicly taken on
  preparation of the regulatory dossiers and clinical substantiation. That pathway is
  recorded here as the applicable regime with its status stated honestly as in-progress
  rather than achieved. The API/protocol standards block is recorded as not-applicable
  rather than false, so this file is never mistaken for a compliance posture the company
  does not claim.
regulatory_regime:
- id: fda-gras-novel-food-ingredient
  name: US FDA Generally Recognized As Safe (GRAS) pathway for a novel algal oil food
    ingredient
  conforms: false
  status: in-progress
  evidence: >-
    Checkerspot markets its algal oils as food and nutrition ingredients, which in the
    US requires GRAS self-affirmation or a GRAS notice to FDA before food use. No FDA
    GRAS "no questions" letter naming Checkerspot, Inc. was found in the 2026-08-02
    search; the GRAS notices surfaced for "algal oil" cover DHA-rich Schizochytrium
    oils from other notifiers, not Checkerspot's sn-2 palmitate or Omega-7 products.
  note: >-
    Recorded as conforms:false because no clearance naming Checkerspot has been
    published, not because the company failed a check. Re-probe on the next pass.
- id: infant-formula-ingredient-pathway
  name: Infant-formula ingredient qualification (US FDA infant formula notification /
    EU novel food) for the high sn-2 palmitate algal oil
  conforms: false
  status: in-progress
  evidence: >-
    In the October 2025 Checkerspot/Huvepharma partnership announcement, Huvepharma is
    stated to be responsible for preparation of the regulatory dossiers, clinical
    substantiation of the ingredient and global distribution - i.e. the regulatory work
    is underway and not complete. Checkerspot's own molecule page markets the oil as a
    bio-equivalent of the fat found in maternal milk.
- id: usda-fsis
  name: USDA FSIS jurisdiction
  conforms: false
  applicable: false
  evidence: not a meat, poultry or egg product; a fermentation-derived lipid ingredient
    sits with FDA
- id: non-gmo-claim
  name: Non genetically engineered production claim
  conforms: true
  applicable: true
  evidence: >-
    Checkerspot announced a patent (April 2024, Business Wire) for a non genetically
    engineered high-oleic microalgae oil, produced by classical strain improvement
    rather than genetic engineering. This is a company claim backed by a granted
    patent, not a third-party certification.
